# What the course site shows, and from when. Deploy/publish.py reads this file; nothing else
# decides what goes live, and only the folders listed here ever leave the Mac.
#
# One entry per line, four fields separated by '|' (spaces around them do not matter):
#
#   site | path | folder | publish from
#
#   site          course, the one site: https://optimization-methods.tarakan-tuc.ru
#   path          where it appears on the site: / or /a/b/ (letters, digits, '.', '_', '-')
#   folder        a folder of this repository, from its root, spelled exactly as on disk,
#                 or a single file of it
#   publish from  now, or YYYY-MM-DD HH:MM in Moscow time
#
# A path may have several lines with different times. At any moment it shows the line with the
# latest time that has come ('now' comes first), and nothing before the time of its first line.
# Publish once with python3 Deploy/publish.py; the server switches a path about a minute after
# the time of its next line without any further action. Deleting a line, or moving its date
# into the future, takes it off the site on the next publish or the next server run. Lines
# starting with '#' are ignored.

course | /                 | Atlas                                 | now

# The seminars' landing page with the topic cards. It is the only file of web/ itself that is
# published: the seminar folders next to it go out one by one, each from its own lines below.
course | /seminars/        | Seminars/Evgeny Baulin/web/index.html | now

# The framework shared by every seminar page (css, js, KaTeX, math.js, PT Serif): the pages
# load it as ../shared/, so it sits next to the seminar folders.
course | /seminars/shared/ | Seminars/Evgeny Baulin/web/shared     | now

